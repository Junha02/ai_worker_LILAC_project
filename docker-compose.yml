services:
  language:
    image: lilac-ros2:humble
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: host
    ipc: host
    environment:
      ROS_LOCALHOST_ONLY: "1"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
    command: ["ros2", "run", "lilac_ros", "language_manager"]

  controller:
    image: lilac-ros2:humble
    network_mode: host
    ipc: host
    environment:
      ROS_LOCALHOST_ONLY: "1"
    command: ["ros2", "launch", "lilac_ros", "controller.launch.py"]
    depends_on:
      - language

  simulation:
    image: lilac-ros2:humble
    network_mode: host
    ipc: host
    environment:
      ROS_LOCALHOST_ONLY: "1"
    command: ["ros2", "run", "lilac_ros", "mock_sim"]
    depends_on:
      - controller
